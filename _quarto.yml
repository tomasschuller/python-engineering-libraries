project:
  type: website
  output-dir: _site

website:
  title: "Python Engineering Libraries"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: 01_core/
        text: Core
      - href: 02_optimization/
        text: Optimization
      - href: 03_cad_meshing/
        text: CAD & Meshing
      - href: 04_ml/
        text: Machine Learning
      - href: 05_data/
        text: Data
      - href: 06_testing_quality/
        text: Testing & Quality
      - href: 07_build_packaging/
        text: Build & Packaging
    right:
      - icon: github
        href: https://github.com/tomasschuller/python-engineering-libraries
        text: GitHub
  sidebar:
    style: "floating"
    contents:
      - section: Getting Started
        contents:
          - index.qmd
      - section: 1. Core Libraries
        contents:
          - 01_core/01_numpy.ipynb
          - 01_core/02_scipy.ipynb
          - 01_core/03_matplotlib.ipynb
      - section: 2. Optimization
        contents:
          - 02_optimization/01_scipy_optimize.ipynb
          - 02_optimization/02_pyomo.ipynb
      - section: 3. CAD & Meshing
        contents:
          - 03_cad_meshing/01_cadquery.ipynb
          - 03_cad_meshing/02_gmsh.ipynb
          - 03_cad_meshing/03_trimesh.ipynb
      - section: 4. Machine Learning
        contents:
          - 04_ml/01_scikit_learn.ipynb
          - 04_ml/02_xgboost.ipynb
      - section: 5. Data
        contents:
          - 05_data/01_plotly.ipynb
          - 05_data/02_pandas.ipynb
          - 05_data/03_cfd_postprocessing.ipynb
      - section: 6. Testing & Quality
        contents:
          - 06_testing_quality/01_pytest.ipynb
          - 06_testing_quality/02_mypy.ipynb
      - section: 7. Build & Packaging
        contents:
          - 07_build_packaging/01_setuptools.ipynb
          - 07_build_packaging/02_uv.ipynb
          - 07_build_packaging/03_hatch.ipynb
          - 07_build_packaging/03_ci.ipynb

format:
  html:
    theme: cosmo
    toc: true
    code-fold: false
    code-line-numbers: true
    highlight-style: github
    css: styles.css
    page-progress: true
    smooth-scroll: true
    reader-mode: true
    link-external-icon: true
    lang: en-US
    date-format: "YYYY-MM-DD"
    number-sections: true
    code-overflow: scroll
    embedded-images: true
    link-external-newtab: true
